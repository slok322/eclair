<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Duel Éclair</title>
<style>
  :root{
    --bg: #0a0c16;
    --bg-2: #12162a;
    --panel: #161b32;
    --cyan: #7cf5ff;
    --violet: #b98bff;
    --red: #ff4d6d;
    --gold: #ffd166;
    --green: #6bffb8;
    --text: #eef0fa;
    --text-dim: #8b90ad;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none;}
  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(120% 120% at 50% -10%, #1c2140 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow-x:hidden;
  }
  #app{
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 24px 16px;
    max-width: 440px;
    margin: 0 auto;
  }
  h1.logo{
    font-family: 'Archivo Black', 'Inter', sans-serif;
    font-size: 2.1rem;
    letter-spacing: -0.5px;
    margin: 0 0 4px 0;
    background: linear-gradient(100deg, var(--cyan), var(--violet));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-align:center;
  }
  .subtitle{ color: var(--text-dim); font-size: 0.9rem; margin-bottom: 32px; text-align:center; letter-spacing:0.3px;}
  .bolt{ display:inline-block; }

  .card{
    background: var(--panel);
    border: 1px solid rgba(124,245,255,0.12);
    border-radius: 18px;
    padding: 24px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  }

  button{
    font-family:inherit; cursor:pointer; border:none; outline:none;
  }
  .btn-primary{
    width:100%;
    background: linear-gradient(100deg, var(--cyan), var(--violet));
    color: #0a0c16;
    font-weight: 800;
    font-size: 1.05rem;
    padding: 16px;
    border-radius: 14px;
    margin-top: 10px;
    letter-spacing: 0.2px;
    transition: transform 0.12s ease;
  }
  .btn-primary:active{ transform: scale(0.97); }
  .btn-secondary{
    width:100%;
    background: transparent;
    border: 1px solid rgba(238,240,250,0.18);
    color: var(--text);
    font-weight: 600;
    font-size: 0.95rem;
    padding: 14px;
    border-radius: 14px;
    margin-top: 12px;
  }
  input.code-input{
    width:100%;
    background: var(--bg-2);
    border: 1px solid rgba(238,240,250,0.15);
    color: var(--text);
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: 8px;
    text-align:center;
    padding: 16px;
    border-radius: 14px;
    margin-top: 6px;
    font-family: 'Archivo Black', monospace;
  }
  input.code-input:focus{ border-color: var(--cyan); }
  .divider{
    text-align:center; color: var(--text-dim); font-size:0.8rem;
    margin: 22px 0; display:flex; align-items:center; gap:10px;
  }
  .divider::before, .divider::after{ content:''; flex:1; height:1px; background: rgba(238,240,250,0.12);}

  .code-display{
    font-family: 'Archivo Black', monospace;
    font-size: 3rem;
    letter-spacing: 10px;
    text-align:center;
    background: linear-gradient(100deg, var(--cyan), var(--violet));
    -webkit-background-clip: text; background-clip:text; color:transparent;
    margin: 20px 0 6px 0;
  }
  .hint{ text-align:center; color: var(--text-dim); font-size: 0.85rem; }
  .pulse-dot{
    width:10px; height:10px; border-radius:50%; background: var(--cyan);
    display:inline-block; margin-right:8px;
    animation: pulse 1.2s infinite ease-in-out;
  }
  @keyframes pulse{ 0%,100%{opacity:0.3; transform:scale(0.8);} 50%{opacity:1; transform:scale(1.2);} }

  .waiting-row{ display:flex; align-items:center; justify-content:center; margin-top:18px; color:var(--text-dim); font-size:0.9rem;}

  .round-label{
    font-family:'Archivo Black', sans-serif;
    color: var(--text-dim);
    font-size: 0.85rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .countdown-num{
    font-family:'Archivo Black', sans-serif;
    font-size: 6rem;
    text-align:center;
    color: var(--gold);
    text-shadow: 0 0 40px rgba(255,209,102,0.6);
    animation: pop 0.5s ease;
  }
  @keyframes pop{ 0%{transform:scale(0.3); opacity:0;} 60%{transform:scale(1.15);} 100%{transform:scale(1); opacity:1;} }

  .seq-stage{
    display:flex; align-items:center; justify-content:center;
    height: 160px;
  }
  .seq-symbol{
    font-size: 5rem;
    animation: flashIn 0.15s ease;
    filter: drop-shadow(0 0 30px currentColor);
  }
  @keyframes flashIn{ from{ transform:scale(0.5); opacity:0;} to{transform:scale(1); opacity:1;} }

  .grid-symbols{
    display:grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 18px;
  }
  .sym-btn{
    aspect-ratio: 1; border-radius: 18px; font-size: 2.4rem;
    background: var(--bg-2); border: 2px solid rgba(238,240,250,0.1);
    display:flex; align-items:center; justify-content:center;
    transition: transform 0.08s ease, border-color 0.15s ease;
  }
  .sym-btn:active{ transform: scale(0.9); }
  .sym-btn.correct{ border-color: var(--green); box-shadow: 0 0 20px rgba(107,255,184,0.5);}
  .sym-btn.wrong{ border-color: var(--red); animation: shake 0.3s ease; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }

  .progress-track{
    display:flex; gap:8px; justify-content:center; margin: 18px 0;
  }
  .progress-dot{
    width: 14px; height:14px; border-radius:50%;
    background: var(--bg-2); border: 2px solid rgba(238,240,250,0.15);
    transition: all 0.15s ease;
  }
  .progress-dot.filled{ background: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 12px var(--cyan); }

  .timer-line{ text-align:center; color: var(--text-dim); font-size: 0.85rem; margin-top: 10px; }

  .result-row{
    display:flex; justify-content:space-between; align-items:center;
    background: var(--bg-2); padding: 16px 18px; border-radius: 14px; margin-top: 10px;
    border: 1px solid rgba(238,240,250,0.08);
  }
  .result-row.winner{ border-color: var(--green); box-shadow: 0 0 20px rgba(107,255,184,0.15); }
  .result-name{ font-weight:700; }
  .result-time{ font-family:'Archivo Black', monospace; font-size:1.1rem; }
  .win-tag{ color: var(--green); font-size:0.75rem; font-weight:800; letter-spacing:1px; text-transform:uppercase;}

  .score-bar{
    display:flex; justify-content:center; gap: 20px; margin-top: 20px;
    font-family:'Archivo Black', sans-serif;
  }
  .score-item{ text-align:center; }
  .score-num{ font-size: 1.8rem; }
  .score-lbl{ font-size:0.7rem; color:var(--text-dim); letter-spacing:1px; text-transform:uppercase; }

  .final-title{
    font-family:'Archivo Black', sans-serif;
    font-size: 2rem; text-align:center; margin-bottom: 6px;
    background: linear-gradient(100deg, var(--gold), var(--red));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .error-toast{
    position:fixed; top:20px; left:50%; transform:translateX(-50%);
    background: var(--red); color:white; padding:10px 18px; border-radius:10px;
    font-size:0.85rem; font-weight:600; z-index:100; box-shadow: 0 10px 30px rgba(255,77,109,0.4);
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const SYMBOLS = [
  {ch:'●', color:'#7cf5ff'},
  {ch:'■', color:'#b98bff'},
  {ch:'▲', color:'#ff4d6d'},
  {ch:'◆', color:'#ffd166'},
  {ch:'★', color:'#6bffb8'},
];
const ROUND_LENGTHS = [3,3,4,4,5];
const TOTAL_ROUNDS = ROUND_LENGTHS.length;
const PENALTY_MS = 350;

const STORAGE_AVAILABLE = (typeof window.storage !== 'undefined' && window.storage !== null);

let state = {
  screen: 'landing', // landing, create-wait, join, waiting-opp, countdown, sequence, input, round-wait, round-result, finished
  code: null,
  playerNum: null,
  session: null,
  roundIndex: 0,
  countdownVal: 3,
  seqDisplayIdx: 0,
  inputProgress: 0,
  errorCount: 0,
  startTime: 0,
  lastTapState: null, // {idx, correct}
  pollTimer: null,
  errorMsg: '',
};

function keyFor(code){ return `duel-eclair-session:${code}`; }
function genCode(){ return String(Math.floor(1000 + Math.random()*9000)); }
function randSeq(len){
  const arr = [];
  for(let i=0;i<len;i++) arr.push(SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)].ch);
  return arr;
}
function generateRounds(){
  return ROUND_LENGTHS.map(len => ({ sequence: randSeq(len), p1Time: null, p2Time: null, p1Errors:0, p2Errors:0 }));
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  const screens = {
    'landing': renderLanding,
    'create-wait': renderCreateWait,
    'join': renderJoin,
    'bot-diff': renderBotDiff,
    'countdown': renderCountdown,
    'sequence': renderSequence,
    'input': renderInput,
    'round-wait': renderRoundWait,
    'round-result': renderRoundResult,
    'finished': renderFinished,
  };
  (screens[state.screen] || renderLanding)(app);
}

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}

function renderLanding(app){
  const wrap = el('div');
  wrap.innerHTML = `
    <h1 class="logo">⚡ Duel Éclair</h1>
    <div class="subtitle">Mémorise. Retape. Le plus rapide gagne.</div>
  `;
  const card = el('div', 'card');
  const createBtn = el('button', 'btn-primary', 'Créer une partie');
  createBtn.onclick = createGame;
  const joinBtn = el('button', 'btn-secondary', 'Rejoindre avec un code');
  joinBtn.onclick = () => { state.screen='join'; render(); };
  const botBtn = el('button', 'btn-secondary', '🤖 Jouer contre un bot');
  botBtn.style.borderColor = 'rgba(185,139,255,0.4)';
  botBtn.onclick = () => { state.screen='bot-diff'; render(); };
  card.appendChild(createBtn);
  card.appendChild(joinBtn);
  card.appendChild(botBtn);
  wrap.appendChild(card);
  if(state.errorMsg){
    const err = el('div', null, state.errorMsg);
    err.style.color = 'var(--red)'; err.style.textAlign='center'; err.style.marginTop='14px'; err.style.fontSize='0.85rem';
    wrap.appendChild(err);
  }
  if(!STORAGE_AVAILABLE){
    const warn = el('div', null, '⚠ Stockage indisponible ici. Ouvre ce jeu depuis l\'aperçu Claude (pas un fichier téléchargé ouvert directement dans le navigateur) pour pouvoir jouer à deux.');
    warn.style.color = 'var(--gold)'; warn.style.textAlign='center'; warn.style.marginTop='18px'; warn.style.fontSize='0.8rem'; warn.style.lineHeight='1.5';
    wrap.appendChild(warn);
  }
  app.appendChild(wrap);
}

function renderBotDiff(app){
  const wrap = el('div');
  wrap.innerHTML = `<h1 class="logo">⚡ Duel Éclair</h1><div class="subtitle">Choisis le niveau du bot</div>`;
  const card = el('div','card');
  const levels = [
    {key:'facile', label:'Facile', desc:'Réflexes lents, se trompe souvent', color:'var(--green)'},
    {key:'normal', label:'Normal', desc:'Rythme correct, quelques erreurs', color:'var(--gold)'},
    {key:'expert', label:'Expert', desc:'Ultra rapide, presque sans faute', color:'var(--red)'},
  ];
  levels.forEach(lv => {
    const btn = el('button', 'btn-secondary');
    btn.style.borderColor = lv.color;
    btn.innerHTML = `<div style="font-weight:800; color:${lv.color};">${lv.label}</div><div style="font-size:0.78rem; color:var(--text-dim); font-weight:400; margin-top:2px;">${lv.desc}</div>`;
    btn.onclick = () => startBotGame(lv.key);
    card.appendChild(btn);
  });
  const back = el('button','btn-secondary','Retour');
  back.style.marginTop = '18px';
  back.onclick = () => { state.screen='landing'; render(); };
  card.appendChild(back);
  wrap.appendChild(card);
  app.appendChild(wrap);
}

function renderJoin(app){
  const wrap = el('div');
  wrap.innerHTML = `<h1 class="logo">⚡ Duel Éclair</h1><div class="subtitle">Entre le code de ton adversaire</div>`;
  const card = el('div','card');
  const input = document.createElement('input');
  input.className = 'code-input';
  input.maxLength = 4;
  input.inputMode = 'numeric';
  input.placeholder = '0000';
  card.appendChild(input);
  const btn = el('button','btn-primary','Rejoindre');
  btn.onclick = () => joinGame(input.value.trim());
  card.appendChild(btn);
  const back = el('button','btn-secondary','Retour');
  back.onclick = () => { state.screen='landing'; render(); };
  card.appendChild(back);
  if(state.errorMsg){
    const err = el('div', null, state.errorMsg);
    err.style.color = 'var(--red)'; err.style.textAlign='center'; err.style.marginTop='14px'; err.style.fontSize='0.85rem';
    card.appendChild(err);
  }
  wrap.appendChild(card);
  app.appendChild(wrap);
  setTimeout(()=>input.focus(), 100);
}

function renderCreateWait(app){
  const wrap = el('div');
  wrap.innerHTML = `<h1 class="logo">⚡ Duel Éclair</h1><div class="subtitle">Partage ce code avec ton ami</div>`;
  const card = el('div','card');
  card.innerHTML = `<div class="code-display">${state.code}</div><div class="hint">Il doit taper ce code sur son téléphone</div>`;
  const wait = el('div','waiting-row','<span class="pulse-dot"></span> En attente d\'un adversaire…');
  card.appendChild(wait);
  const back = el('button','btn-secondary','Annuler');
  back.onclick = () => { stopPolling(); state.screen='landing'; render(); };
  card.appendChild(back);
  wrap.appendChild(card);
  app.appendChild(wrap);
}

function renderCountdown(app){
  const wrap = el('div');
  const label = el('div','round-label', `Round ${state.roundIndex+1} / ${TOTAL_ROUNDS}`);
  const card = el('div','card');
  card.appendChild(label);
  const num = el('div','countdown-num', state.countdownVal > 0 ? state.countdownVal : 'GO');
  card.appendChild(num);
  wrap.appendChild(card);
  app.appendChild(wrap);
}

function renderSequence(app){
  const wrap = el('div');
  const label = el('div','round-label', `Round ${state.roundIndex+1} / ${TOTAL_ROUNDS} — Mémorise !`);
  const card = el('div','card');
  card.appendChild(label);
  const stage = el('div','seq-stage');
  const seq = state.session.rounds[state.roundIndex].sequence;
  const symCh = seq[state.seqDisplayIdx];
  const symObj = SYMBOLS.find(s => s.ch === symCh);
  const symEl = el('div','seq-symbol', symCh);
  symEl.style.color = symObj.color;
  stage.appendChild(symEl);
  card.appendChild(stage);
  const dots = el('div','progress-track');
  seq.forEach((s,i) => {
    const d = el('div', 'progress-dot' + (i <= state.seqDisplayIdx ? ' filled' : ''));
    dots.appendChild(d);
  });
  card.appendChild(dots);
  wrap.appendChild(card);
  app.appendChild(wrap);
}

function renderInput(app){
  const wrap = el('div');
  const seq = state.session.rounds[state.roundIndex].sequence;
  const label = el('div','round-label', `Round ${state.roundIndex+1} / ${TOTAL_ROUNDS} — À toi de jouer !`);
  const card = el('div','card');
  card.appendChild(label);
  const dots = el('div','progress-track');
  seq.forEach((s,i) => {
    const d = el('div', 'progress-dot' + (i < state.inputProgress ? ' filled' : ''));
    dots.appendChild(d);
  });
  card.appendChild(dots);
  const grid = el('div','grid-symbols');
  SYMBOLS.forEach(s => {
    const btn = el('button','sym-btn', s.ch);
    btn.style.color = s.color;
    if(state.lastTapState && state.lastTapState.ch === s.ch){
      btn.classList.add(state.lastTapState.correct ? 'correct' : 'wrong');
    }
    btn.onclick = () => onTap(s.ch);
    grid.appendChild(btn);
  });
  card.appendChild(grid);
  const timerLine = el('div','timer-line', state.errorCount > 0 ? `⚠ ${state.errorCount} erreur(s) — pénalité +${state.errorCount*PENALTY_MS}ms` : 'Reproduis la séquence dans l\'ordre');
  card.appendChild(timerLine);
  wrap.appendChild(card);
  app.appendChild(wrap);
}

function renderRoundWait(app){
  const wrap = el('div');
  const label = el('div','round-label', `Round ${state.roundIndex+1} / ${TOTAL_ROUNDS}`);
  const card = el('div','card');
  card.appendChild(label);
  const r = state.session.rounds[state.roundIndex];
  const myTime = state.playerNum === 1 ? r.p1Time : r.p2Time;
  card.innerHTML += `<div class="code-display" style="font-size:2.2rem;">${(myTime/1000).toFixed(2)}s</div>`;
  const waitMsg = state.mode === 'bot' ? 'Le bot calcule son temps…' : 'En attente du temps de ton adversaire…';
  const wait = el('div','waiting-row',`<span class="pulse-dot"></span> ${waitMsg}`);
  card.appendChild(wait);
  wrap.appendChild(card);
  app.appendChild(wrap);
}

function renderRoundResult(app){
  const wrap = el('div');
  const r = state.session.rounds[state.roundIndex];
  const iWon = state.playerNum === 1 ? r.p1Time < r.p2Time : r.p2Time < r.p1Time;
  const label = el('div','round-label', `Résultat — Round ${state.roundIndex+1} / ${TOTAL_ROUNDS}`);
  const card = el('div','card');
  card.appendChild(label);

  const rowMe = el('div', 'result-row' + (iWon ? ' winner' : ''));
  const myTime = state.playerNum === 1 ? r.p1Time : r.p2Time;
  rowMe.innerHTML = `<div><div class="result-name">Toi</div>${iWon ? '<div class="win-tag">Victoire</div>' : ''}</div><div class="result-time">${(myTime/1000).toFixed(2)}s</div>`;
  card.appendChild(rowMe);

  const oppLabel = state.mode === 'bot' ? '🤖 Bot' : 'Adversaire';
  const rowOpp = el('div', 'result-row' + (!iWon ? ' winner' : ''));
  const oppTime = state.playerNum === 1 ? r.p2Time : r.p1Time;
  rowOpp.innerHTML = `<div><div class="result-name">${oppLabel}</div>${!iWon ? '<div class="win-tag">Victoire</div>' : ''}</div><div class="result-time">${(oppTime/1000).toFixed(2)}s</div>`;
  card.appendChild(rowOpp);

  const scores = computeScores();
  const scoreBar = el('div','score-bar');
  scoreBar.innerHTML = `
    <div class="score-item"><div class="score-num" style="color:var(--cyan)">${state.playerNum===1?scores.p1:scores.p2}</div><div class="score-lbl">Toi</div></div>
    <div class="score-item"><div class="score-num" style="color:var(--text-dim)">${state.playerNum===1?scores.p2:scores.p1}</div><div class="score-lbl">${state.mode==='bot' ? 'Bot' : 'Adversaire'}</div></div>
  `;
  card.appendChild(scoreBar);

  const hint = el('div','hint', state.roundIndex < TOTAL_ROUNDS - 1 ? 'Round suivant dans un instant…' : 'Calcul du résultat final…');
  hint.style.marginTop = '16px';
  card.appendChild(hint);

  wrap.appendChild(card);
  app.appendChild(wrap);
}

function renderFinished(app){
  const scores = computeScores();
  const mine = state.playerNum === 1 ? scores.p1 : scores.p2;
  const theirs = state.playerNum === 1 ? scores.p2 : scores.p1;
  let titleText, emoji;
  const oppLabel = state.mode === 'bot' ? 'le bot' : 'ton adversaire';
  if(mine > theirs){ titleText = 'Tu remportes le duel !'; emoji = '⚡🏆'; }
  else if(mine < theirs){ titleText = `${state.mode==='bot' ? 'Le bot' : 'Ton adversaire'} l'emporte`; emoji = '⚡💥'; }
  else { titleText = 'Égalité parfaite !'; emoji = '⚡🤝'; }

  const wrap = el('div');
  const card = el('div','card');
  card.innerHTML = `
    <div style="text-align:center; font-size:3rem; margin-bottom:8px;">${emoji}</div>
    <div class="final-title">${titleText}</div>
  `;
  const scoreBar = el('div','score-bar');
  scoreBar.innerHTML = `
    <div class="score-item"><div class="score-num" style="color:var(--cyan)">${mine}</div><div class="score-lbl">Toi</div></div>
    <div class="score-item"><div class="score-num" style="color:var(--text-dim)">${theirs}</div><div class="score-lbl">${state.mode==='bot' ? 'Bot' : 'Adversaire'}</div></div>
  `;
  card.appendChild(scoreBar);
  const btn = el('button','btn-primary','Nouvelle partie');
  btn.onclick = () => { stopPolling(); resetState(); render(); };
  card.appendChild(btn);
  wrap.appendChild(card);
  app.appendChild(wrap);
}

function computeScores(){
  let p1=0, p2=0;
  state.session.rounds.forEach((r,i) => {
    if(i > state.roundIndex) return;
    if(r.p1Time == null || r.p2Time == null) return;
    if(r.p1Time < r.p2Time) p1++; else if(r.p2Time < r.p1Time) p2++;
  });
  return {p1,p2};
}

function resetState(){
  state = { ...state, screen:'landing', code:null, playerNum:null, session:null, roundIndex:0, countdownVal:3, seqDisplayIdx:0, inputProgress:0, errorCount:0, startTime:0, lastTapState:null, errorMsg:'', mode:null, botLevel:null };
}

// ---- storage helpers ----
async function saveSession(){
  try{
    const result = await window.storage.set(keyFor(state.code), JSON.stringify(state.session), true);
    return !!result;
  }catch(err){ console.error('save failed', err); return false; }
}
async function updateSessionRemote(mutator){
  try{
    const fresh = await window.storage.get(keyFor(state.code), true);
    const freshSession = fresh ? JSON.parse(fresh.value) : state.session;
    mutator(freshSession);
    state.session = freshSession;
    await window.storage.set(keyFor(state.code), JSON.stringify(freshSession), true);
  }catch(err){ console.error('update failed', err); }
}
async function pollSession(){
  try{
    const res = await window.storage.get(keyFor(state.code), true);
    if(res) state.session = JSON.parse(res.value);
  }catch(err){ /* not found yet, ignore */ }
}

function stopPolling(){
  if(state.pollTimer){ clearInterval(state.pollTimer); state.pollTimer = null; }
}

// ---- game flow ----
async function createGame(){
  if(!STORAGE_AVAILABLE){
    state.errorMsg = 'Le stockage n\'est pas disponible dans ce contexte. Ouvre le jeu depuis l\'aperçu Claude.';
    render();
    return;
  }
  state.code = genCode();
  state.playerNum = 1;
  state.session = {
    status: 'waiting',
    p1Present: true,
    p2Present: false,
    rounds: generateRounds(),
  };
  const ok = await saveSession();
  if(!ok){
    state.errorMsg = 'Impossible de créer la partie (stockage inaccessible). Réessaie.';
    state.screen = 'landing';
    render();
    return;
  }
  state.screen = 'create-wait';
  render();
  state.pollTimer = setInterval(async () => {
    await pollSession();
    if(state.session && state.session.p2Present){
      stopPolling();
      state.roundIndex = 0;
      startCountdown();
    }
  }, 1200);
}

async function joinGame(codeInput){
  if(!STORAGE_AVAILABLE){
    state.errorMsg = 'Le stockage n\'est pas disponible dans ce contexte. Ouvre le jeu depuis l\'aperçu Claude.';
    render();
    return;
  }
  if(!/^\d{4}$/.test(codeInput)){
    state.errorMsg = 'Entre un code à 4 chiffres.';
    render();
    return;
  }
  let res = null;
  let fetchFailed = false;
  try{
    res = await window.storage.get(keyFor(codeInput), true);
  }catch(err){
    console.error('get failed', err);
    fetchFailed = true;
  }
  if(fetchFailed || !res || !res.value){
    state.errorMsg = 'Code introuvable. Vérifie que ton ami a bien créé la partie et réessaie.';
    render();
    return;
  }
  try{
    const session = JSON.parse(res.value);
    session.p2Present = true;
    session.status = 'playing';
    state.code = codeInput;
    state.playerNum = 2;
    state.session = session;
    const ok = await saveSession();
    if(!ok){
      state.errorMsg = 'Impossible de rejoindre (échec de connexion). Réessaie.';
      render();
      return;
    }
    state.errorMsg = '';
    state.roundIndex = 0;
    startCountdown();
  }catch(err){
    console.error('join failed', err);
    state.errorMsg = 'Impossible de rejoindre. Réessaie.';
    render();
  }
}

const BOT_PROFILES = {
  facile:  { perSymbol: 680, jitter: 420, errorChance: 0.45 },
  normal:  { perSymbol: 480, jitter: 260, errorChance: 0.22 },
  expert:  { perSymbol: 340, jitter: 160, errorChance: 0.09 },
};

function botTimeForRound(roundIndex, level){
  const L = ROUND_LENGTHS[roundIndex];
  const profile = BOT_PROFILES[level];
  let errors = 0;
  for(let i=0;i<L;i++){ if(Math.random() < profile.errorChance) errors += 1; }
  const raw = L * profile.perSymbol + Math.random() * profile.jitter * L;
  return Math.round(raw + errors * PENALTY_MS);
}

function startBotGame(level){
  state.mode = 'bot';
  state.botLevel = level;
  state.playerNum = 1;
  state.code = null;
  state.session = { status:'playing', p1Present:true, p2Present:true, rounds: generateRounds() };
  state.roundIndex = 0;
  startCountdown();
}

function startCountdown(){
  state.screen = 'countdown';
  state.countdownVal = 3;
  state.errorCount = 0;
  render();
  const iv = setInterval(() => {
    state.countdownVal -= 1;
    if(state.countdownVal < 0){
      clearInterval(iv);
      startSequenceDisplay();
      return;
    }
    render();
  }, 700);
}

function startSequenceDisplay(){
  state.screen = 'sequence';
  state.seqDisplayIdx = 0;
  render();
  const seq = state.session.rounds[state.roundIndex].sequence;
  const iv = setInterval(() => {
    state.seqDisplayIdx += 1;
    if(state.seqDisplayIdx >= seq.length){
      clearInterval(iv);
      startInputPhase();
      return;
    }
    render();
  }, 650);
}

function startInputPhase(){
  state.screen = 'input';
  state.inputProgress = 0;
  state.errorCount = 0;
  state.lastTapState = null;
  state.startTime = performance.now();
  render();
}

function onTap(ch){
  const seq = state.session.rounds[state.roundIndex].sequence;
  const expected = seq[state.inputProgress];
  if(ch === expected){
    state.lastTapState = {ch, correct:true};
    state.inputProgress += 1;
    render();
    if(state.inputProgress >= seq.length){
      setTimeout(finishRound, 150);
    }
  } else {
    state.lastTapState = {ch, correct:false};
    state.errorCount += 1;
    state.inputProgress = 0;
    render();
  }
}

function advanceAfterResult(){
  setTimeout(() => {
    if(state.roundIndex < TOTAL_ROUNDS - 1){
      state.roundIndex += 1;
      startCountdown();
    } else {
      state.screen = 'finished';
      render();
    }
  }, 2800);
}

async function finishRound(){
  const elapsed = performance.now() - state.startTime + state.errorCount * PENALTY_MS;
  const roundedElapsed = Math.round(elapsed);

  if(state.mode === 'bot'){
    const r = state.session.rounds[state.roundIndex];
    r.p1Time = roundedElapsed;
    r.p1Errors = state.errorCount;
    r.p2Time = botTimeForRound(state.roundIndex, state.botLevel);
    state.screen = 'round-wait';
    render();
    setTimeout(() => {
      state.screen = 'round-result';
      render();
      advanceAfterResult();
    }, 600);
    return;
  }

  const field = state.playerNum === 1 ? 'p1Time' : 'p2Time';
  const errField = state.playerNum === 1 ? 'p1Errors' : 'p2Errors';
  await updateSessionRemote(s => {
    s.rounds[state.roundIndex][field] = roundedElapsed;
    s.rounds[state.roundIndex][errField] = state.errorCount;
  });
  state.screen = 'round-wait';
  render();
  state.pollTimer = setInterval(async () => {
    await pollSession();
    const r = state.session.rounds[state.roundIndex];
    if(r.p1Time != null && r.p2Time != null){
      stopPolling();
      state.screen = 'round-result';
      render();
      advanceAfterResult();
    }
  }, 1000);
}

render();
</script>
